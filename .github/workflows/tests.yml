name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Parsers
        run: python tests/test_parsers.py
      - name: NetEase YRC verbatim
        run: python tests/test_netease_yrc.py
      - name: Pipeline
        run: python tests/test_pipeline.py
      - name: Safety
        run: python tests/test_m1_safety.py
      - name: GPU plain-text fallback
        run: python tests/test_gpu_plain.py
      - name: Kugou duration gates
        run: python tests/test_kugou_gates.py
      - name: Converter prelude credits
        run: python tests/test_converter_prelude.py
      - name: Apple TTML ladder
        run: python tests/test_apple_ttml.py
      - name: Cover art ladder
        run: python tests/test_cover_art.py
      - name: Acoustic pipeline
        run: python tests/test_acoustic_pipeline.py
      - name: Jyutping G2P
        run: python tests/test_jyutping.py
      - name: Language routing
        run: python tests/test_lang_detect.py
      - name: Cantonese CTC align
        run: python tests/test_canto_align.py
      - name: CLI & End-to-end
        run: python tests/test_cli.py
      - name: Text utils & KRC decrypt
        run: python tests/test_text_utils.py
      - name: Process song orchestration
        run: python tests/test_process_song.py
      - name: Line axis calibration
        run: python tests/test_line_axis.py
      - name: Mandarin CTC align
        run: python tests/test_acoustic_zh.py
      - name: Acoustic gate
        run: python tests/test_gate.py
      - name: Quality control
        run: python tests/test_qc.py

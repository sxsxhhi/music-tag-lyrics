name: Windows core blocking gate (v1.8.5)

# Windows 平台关键能力硬门禁 (continue-on-error: false)
# 覆盖缓存路径回退、ISRC 容器门禁、标准流程、标准化 CLI、
# FLAC/MP3/WAV 容器回读、音频流主体不变性、TTML 外部规范与结构兼容性。
# M4A 写回因缺少同级别物理断言仍保留为 NOT_VERIFIED。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-core-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache paths (Windows)
        id: cache_paths
        shell: pwsh
        run: python -B tests/test_cache_paths.py *>&1 | Tee-Object -FilePath cache_paths.log

      - name: ISRC and container safety (Windows)
        id: isrc
        shell: pwsh
        run: python -B tests/test_isrc_integration.py *>&1 | Tee-Object -FilePath isrc.log

      - name: Process song flow (Windows)
        id: process_song
        shell: pwsh
        run: python -B tests/test_process_song.py *>&1 | Tee-Object -FilePath process_song.log

      - name: Standardization CLI (Windows)
        id: standard_cli
        shell: pwsh
        run: python -B tests/test_standard_cli.py *>&1 | Tee-Object -FilePath standard_cli.log

      - name: Container tags readback (Windows)
        id: container_tags
        shell: pwsh
        run: python -B tests/test_standard_container_tags.py *>&1 | Tee-Object -FilePath container_tags.log

      - name: Audio stream invariance (Windows)
        id: stream_invariance
        shell: pwsh
        run: python -B tests/test_audio_stream_invariance.py *>&1 | Tee-Object -FilePath stream_invariance.log

      - name: TTML external conformance (Windows)
        id: ttml_conformance
        shell: pwsh
        run: python -B tests/test_ttml_external_conformance.py *>&1 | Tee-Object -FilePath ttml_conformance.log

      - name: TTML structural compatibility (Windows)
        id: ttml_structural
        shell: pwsh
        run: python -B tests/test_ttml_structural_compat.py *>&1 | Tee-Object -FilePath ttml_structural.log

      - name: Post-review hardening regression (Windows)
        id: postreview
        shell: pwsh
        run: python -B tests/test_v182_postreview.py *>&1 | Tee-Object -FilePath postreview.log

      - name: v1.8.3 final safety guard regression (Windows)
        id: final_guard
        shell: pwsh
        run: python -B tests/test_v183_final_guard.py *>&1 | Tee-Object -FilePath final_guard.log

      - name: v1.8.3 R9 input integrity regression (Windows)
        id: r9_integrity
        shell: pwsh
        run: python -B tests/test_v183_round9_integrity.py *>&1 | Tee-Object -FilePath r9_integrity.log

      - name: v1.8.4 multi-track lyric integrity regression (Windows)
        id: multitrack_integrity
        shell: pwsh
        run: python -B tests/test_v184_multitrack_integrity.py *>&1 | Tee-Object -FilePath multitrack_integrity.log

      - name: v1.8.4 post-review security regression (Windows)
        id: security_regressions
        shell: pwsh
        run: python -B tests/test_v184_security_regressions.py *>&1 | Tee-Object -FilePath security_regressions.log

      - name: v1.8.4 release gate regression (Windows)
        id: release_gate_regressions
        shell: pwsh
        run: python -B tests/test_v184_release_gate_regressions.py *>&1 | Tee-Object -FilePath release_gate_regressions.log

      - name: v1.8.4 R12 safety regression (Windows)
        id: r12_safety_regressions
        shell: pwsh
        run: python -B tests/test_v184_round12_safety.py *>&1 | Tee-Object -FilePath r12_safety.log

      - name: v1.8.4 R13 safety regression (Windows)
        id: r13_safety_regressions
        shell: pwsh
        run: python -B tests/test_v184_round13_safety.py *>&1 | Tee-Object -FilePath r13_safety.log

      # v1.8.5：ID3v1 保真 / FLAC 块指纹 / 抓取上限 / 独立审计反例 / R2 fail-closed。
      # 这些是 P1 级数据保真回归，必须与既有安全回归同等对待（原先只在 Linux run_all 覆盖）。
      - name: v1.8.5 independent audit regressions (Windows)
        id: v185_audit
        shell: pwsh
        run: python -B tests/test_v185_postrelease_audit.py *>&1 | Tee-Object -FilePath v185_audit.log

      - name: v1.8.5 ID3v1 fidelity (Windows)
        id: v185_id3v1
        shell: pwsh
        run: python -B tests/test_v185_id3v1_fidelity.py *>&1 | Tee-Object -FilePath v185_id3v1.log

      - name: v1.8.5 FLAC metadata fingerprint (Windows)
        id: v185_fingerprint
        shell: pwsh
        run: python -B tests/test_v185_metadata_fingerprint.py *>&1 | Tee-Object -FilePath v185_fingerprint.log

      - name: v1.8.5 HTTP response limits (Windows)
        id: v185_http_limits
        shell: pwsh
        run: python -B tests/test_v185_http_limits.py *>&1 | Tee-Object -FilePath v185_http_limits.log

      - name: v1.8.5 R2 fail-closed regressions (Windows)
        id: v185_r2
        shell: pwsh
        run: python -B tests/test_v185_r2_failclosed.py *>&1 | Tee-Object -FilePath v185_r2.log

      - name: Summarise Windows core gate
        if: always()
        shell: pwsh
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          $suites = @(
            "cache_paths.log",
            "isrc.log",
            "process_song.log",
            "standard_cli.log",
            "container_tags.log",
            "stream_invariance.log",
            "ttml_conformance.log",
            "ttml_structural.log",
            "postreview.log",
            "final_guard.log",
            "r9_integrity.log",
            "multitrack_integrity.log",
            "security_regressions.log",
            "release_gate_regressions.log",
            "r12_safety.log",
            "r13_safety.log",
            "v185_audit.log",
            "v185_id3v1.log",
            "v185_fingerprint.log",
            "v185_http_limits.log",
            "v185_r2.log"
          )
          $out = @()
          $out += "## Windows Core Blocking Gate Results"
          $out += ""
          $out += "- Run SHA: $($env:RUN_SHA)"
          $out += "- All suites executed with strict blocking gate (continue-on-error: false)."
          $out += "- M4A tag write-back remains NOT_VERIFIED."
          $out += ""
          $out += "| suite | passed | failed | skipped | total |"
          $out += "| --- | --- | --- | --- | --- |"
          $missingTotal = 0
          foreach ($file in $suites) {
            $log = ""
            if (Test-Path $file) { $log = Get-Content $file -Raw }
            # 只认 runner 的结构化汇总行（"TOTAL: x/y passed, z skipped"）。
            # 旧实现按 "PASS"/"FAIL"/"SKIP" 词频统计，测试名或失败信息里含这些词就会失真。
            $m = [regex]::Match($log, "TOTAL:\s*(\d+)/(\d+)\s+passed,\s*(\d+)\s+skipped")
            if ($m.Success) {
              $passed = [int]$m.Groups[1].Value
              $total  = [int]$m.Groups[2].Value
              $skipped = [int]$m.Groups[3].Value
              $failed = $total - $passed - $skipped
              $out += "| $file | $passed | $failed | $skipped | $total |"
              if ($failed -gt 0) {
                Write-Host "::warning title=Windows gate::$file 有 $failed 个失败用例"
              }
            } else {
              $missingTotal += 1
              $out += "| $file | - | ? | - | - |"
              Write-Host "::warning title=Windows gate::$file 未产出 TOTAL 汇总行（脚本可能中断）"
            }
          }
          if ($missingTotal -gt 0) {
            $out += ""
            $out += "- $missingTotal 个日志缺少 TOTAL 汇总行，已标记为 ?，请查看原始日志。"
          }
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

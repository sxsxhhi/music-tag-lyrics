name: Windows CPU smoke (observational, H17)

# 独立于 Ubuntu 主门禁的 Windows CPU 观察 job。
# - 不计入 25 套件 / 434 用例主基线，主基线只指 tests/run_all.py 的 Ubuntu 离线结果。
# - 观察期允许 continue-on-error，但结果必须写入 Job Summary 并输出 ::warning::，
#   避免失败只埋在日志深处。
# - 复审期限：达到第 10 次运行 或 第 14 个日历日（先到者），维护者必须书面决定
#   「转阻断 / 批准延长并解释 / 修复失败」。本文件存在不代表该复审已执行。
# - M4A 写回不因本 job 而变为已验证，仍为 NOT_VERIFIED。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache paths (Windows)
        id: cache_paths
        continue-on-error: true
        shell: pwsh
        run: python tests/test_cache_paths.py *>&1 | Tee-Object -FilePath cache_paths.log

      - name: ISRC and container safety (Windows)
        id: isrc
        continue-on-error: true
        shell: pwsh
        run: python tests/test_isrc_integration.py *>&1 | Tee-Object -FilePath isrc.log

      - name: Process song flow (Windows)
        id: process_song
        continue-on-error: true
        shell: pwsh
        run: python tests/test_process_song.py *>&1 | Tee-Object -FilePath process_song.log

      - name: Summarise Windows smoke
        if: always()
        shell: pwsh
        env:
          OUTCOME_CACHE: ${{ steps.cache_paths.outcome }}
          OUTCOME_ISRC: ${{ steps.isrc.outcome }}
          OUTCOME_PROCESS: ${{ steps.process_song.outcome }}
          RUN_SHA: ${{ github.sha }}
        run: |
          $rows = @(
            [pscustomobject]@{ Name = "test_cache_paths.py";      Outcome = $env:OUTCOME_CACHE;   File = "cache_paths.log" },
            [pscustomobject]@{ Name = "test_isrc_integration.py"; Outcome = $env:OUTCOME_ISRC;    File = "isrc.log" },
            [pscustomobject]@{ Name = "test_process_song.py";     Outcome = $env:OUTCOME_PROCESS; File = "process_song.log" }
          )
          $out = @()
          $out += "## Windows CPU smoke (observational)"
          $out += ""
          $out += "- Run SHA: $($env:RUN_SHA)"
          $out += "- Not part of the Ubuntu offline baseline (25 suites / 434 cases)."
          $out += "- M4A tag write-back remains NOT_VERIFIED."
          $out += ""
          $out += "| suite | step outcome | PASS | FAIL | SKIP |"
          $out += "| --- | --- | --- | --- | --- |"
          foreach ($r in $rows) {
            $log = ""
            if (Test-Path $r.File) { $log = Get-Content $r.File -Raw }
            $pass = ([regex]::Matches($log, "PASS")).Count
            $fail = ([regex]::Matches($log, "FAIL")).Count
            $skip = ([regex]::Matches($log, "SKIP")).Count
            $out += "| $($r.Name) | $($r.Outcome) | $pass | $fail | $skip |"
            if ($r.Outcome -ne "success") {
              Write-Host "::warning title=Windows smoke::$($r.Name) outcome=$($r.Outcome) fail=$fail"
            }
          }
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

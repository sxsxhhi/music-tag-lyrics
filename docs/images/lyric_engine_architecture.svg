<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <style>
      :root {
        --bg: #ffffff;
        --panel-bg: #f6f8fa;
        --panel-border: #d0d7de;
        --card-bg: #ffffff;
        --card-border: #e1e4e8;
        --text-title: #1f2328;
        --text-body: #24292f;
        --text-sub: #57606a;
        --accent-blue: #0969da;
        --accent-blue-bg: #ddf4ff;
        --accent-purple: #8250df;
        --accent-purple-bg: #fbefff;
        --accent-green: #1a7f37;
        --accent-green-bg: #dafbe1;
        --accent-orange: #bc4c00;
        --accent-orange-bg: #fff1e5;
        --accent-red: #cf222e;
        --accent-red-bg: #ffebe9;
        --line: #8c959f;
        --arrow: #57606a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --panel-bg: #161b22;
          --panel-border: #30363d;
          --card-bg: #21262d;
          --card-border: #363b42;
          --text-title: #f0f6fc;
          --text-body: #c9d1d9;
          --text-sub: #8b949e;
          --accent-blue: #58a6ff;
          --accent-blue-bg: #0d2d5e;
          --accent-purple: #bc8cff;
          --accent-purple-bg: #351a68;
          --accent-green: #3fb950;
          --accent-green-bg: #11381c;
          --accent-orange: #f0883e;
          --accent-orange-bg: #4d2306;
          --accent-red: #f85149;
          --accent-red-bg: #491316;
          --line: #6e7681;
          --arrow: #8b949e;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: var(--text-title); }
      .subtitle { font-size: 12px; fill: var(--text-sub); }
      .sect-title { font-size: 13px; font-weight: 700; fill: var(--text-title); }
      .card-title { font-size: 12px; font-weight: 600; fill: var(--text-title); }
      .card-desc { font-size: 11px; fill: var(--text-sub); }
      .badge-text { font-size: 10px; font-weight: 600; }
      .branch-lbl { font-size: 10px; font-weight: 600; fill: var(--text-sub); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--arrow)"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--accent-green)"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--accent-blue)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="12" fill="var(--bg)"/>

  <!-- Header -->
  <text x="32" y="34" class="title">🎵 music-tag-lyrics v1.6.1 全景调度与双引擎声学打轴架构</text>
  <text x="32" y="52" class="subtitle">六源梯级智能搜词（网易 YRC 逐字）→ 国语/粤语双专用 CTC 逐行窗声学打轴 → 逐行合理性闸 → 起唱点校准 (−60ms) → 三位一体交付</text>

  <!-- ==================== Section 1: Input & Tag Clean (x=28, w=136) ==================== -->
  <rect x="28" y="72" width="136" height="384" rx="8" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1.5"/>
  <text x="40" y="96" class="sect-title">🎧 音频读取与清洗</text>

  <!-- Step 1.1 Audio Input -->
  <g transform="translate(36, 112)">
    <rect width="120" height="92" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="10" y="22" class="card-title">音频母体文件</text>
    <text x="10" y="40" class="card-desc">FLAC / MP3 / M4A</text>
    <text x="10" y="56" class="card-desc">WAV / OGG / DSF</text>
    <rect x="10" y="66" width="100" height="18" rx="4" fill="var(--accent-blue-bg)"/>
    <text x="16" y="79" class="badge-text" fill="var(--accent-blue)">原地只读无破坏</text>
  </g>

  <!-- Flow 1.1 -> 1.2 -->
  <path d="M 96 204 L 96 226" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 1.2 Tag Clean -->
  <g transform="translate(36, 230)">
    <rect width="120" height="196" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="10" y="22" class="card-title">🏷️ 标签安全规范化</text>
    <text x="10" y="42" class="card-desc">• 规范合唱歌手 /</text>
    <text x="10" y="58" class="card-desc">• 4位标准年份清洗</text>
    <text x="10" y="74" class="card-desc">• 作词/作曲自动补</text>
    <text x="10" y="90" class="card-desc">• 歌名-歌手防空兜底</text>
    <text x="10" y="106" class="card-desc">• 单帧 USLT 避免冲突</text>
    <text x="10" y="122" class="card-desc">• 原文件名绝对不改</text>
    <rect x="10" y="152" width="100" height="20" rx="4" fill="var(--accent-green-bg)"/>
    <text x="14" y="166" class="badge-text" fill="var(--accent-green)">原地原子安全替换</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 164 250 L 186 250" stroke="var(--line)" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ==================== Section 2: Six-tier Cascade (x=188, w=384) ==================== -->
  <rect x="188" y="72" width="384" height="384" rx="8" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1.5"/>
  <text x="202" y="96" class="sect-title">🌐 六级多源歌词调度 (单调等级门禁)</text>
  <rect x="466" y="82" width="96" height="20" rx="4" fill="var(--accent-purple-bg)"/>
  <text x="472" y="96" class="badge-text" fill="var(--accent-purple)">防低级源降级顶替</text>

  <!-- ROW 1 (Priority Tiers 1-3) -->
  <rect x="198" y="112" width="364" height="140" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-dasharray="3 3"/>
  <text x="208" y="130" class="badge-text" fill="var(--accent-blue)">⭐ 官方母带优先梯级 (Tier 1 ~ 3)</text>

  <!-- T1: Apple TTML -->
  <g transform="translate(206, 140)">
    <rect width="108" height="102" rx="6" fill="var(--panel-bg)" stroke="var(--accent-blue)" stroke-width="1.5"/>
    <text x="6" y="18" class="card-title" fill="var(--accent-blue)">T1: Apple TTML</text>
    <text x="6" y="36" class="card-desc">• 4-origin 攒票容灾</text>
    <text x="6" y="52" class="card-desc">• iTunes 毫秒精准度</text>
    <text x="6" y="68" class="card-desc">• 3位高精母带逐字</text>
    <rect x="6" y="78" width="96" height="16" rx="3" fill="var(--accent-blue-bg)"/>
    <text x="10" y="90" class="badge-text" fill="var(--accent-blue)">Apple Music 逐字</text>
  </g>

  <path d="M 314 191 L 326 191" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- T2: Kugou KRC -->
  <g transform="translate(328, 140)">
    <rect width="108" height="102" rx="6" fill="var(--panel-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="6" y="18" class="card-title">T2: 酷狗音乐</text>
    <text x="6" y="36" class="card-desc">• 原生 KRC 逐字</text>
    <text x="6" y="52" class="card-desc">• 华语经典高命中</text>
    <text x="6" y="68" class="card-desc">• 尾奏长 Solo 保护</text>
    <rect x="6" y="78" width="96" height="16" rx="3" fill="var(--accent-green-bg)"/>
    <text x="10" y="90" class="badge-text" fill="var(--accent-green)">华语逐字主力源</text>
  </g>

  <path d="M 436 191 L 448 191" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- T3: AMLL -->
  <g transform="translate(450, 140)">
    <rect width="104" height="102" rx="6" fill="var(--panel-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="6" y="18" class="card-title">T3: AMLL</text>
    <text x="6" y="36" class="card-desc">• 社区 NCM 直连</text>
    <text x="6" y="52" class="card-desc">• TTML 官方母带</text>
    <text x="6" y="68" class="card-desc">• 丰富曲库深度扩充</text>
    <rect x="6" y="78" width="92" height="16" rx="3" fill="var(--accent-blue-bg)"/>
    <text x="10" y="90" class="badge-text" fill="var(--accent-blue)">社区母带精选</text>
  </g>

  <!-- Flow Row 1 to Row 2 -->
  <path d="M 554 191 Q 566 191 566 256 T 206 256 L 206 288" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ROW 2 (Fallback Tiers 4-6) -->
  <rect x="198" y="272" width="364" height="142" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-dasharray="3 3"/>
  <text x="208" y="290" class="badge-text" fill="var(--accent-orange)">🔄 官方翻译 / 逐字兜底与全球开源 (Tier 4 ~ 6)</text>

  <!-- T4: Netease -->
  <g transform="translate(206, 300)">
    <rect width="108" height="102" rx="6" fill="var(--panel-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="6" y="18" class="card-title">T4: 网易云音乐</text>
    <text x="6" y="36" class="card-desc">• YRC 原生逐字</text>
    <text x="6" y="52" class="card-desc">• 官方 tlyric</text>
    <text x="6" y="68" class="card-desc">• 杜绝机械机翻</text>
    <rect x="6" y="78" width="96" height="16" rx="3" fill="var(--accent-purple-bg)"/>
    <text x="10" y="90" class="badge-text" fill="var(--accent-purple)">逐字 + 行级兜底</text>
  </g>

  <path d="M 314 351 L 326 351" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- T5: LRCSHARE -->
  <g transform="translate(328, 300)">
    <rect width="108" height="102" rx="6" fill="var(--panel-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="6" y="18" class="card-title">T5: LRCSHARE</text>
    <text x="6" y="36" class="card-desc">• 社区云端 TTML/LRC</text>
    <text x="6" y="52" class="card-desc">• 多语言版本精准筛</text>
    <text x="6" y="68" class="card-desc">• 免无谓请求拦截</text>
    <rect x="6" y="78" width="96" height="16" rx="3" fill="var(--accent-blue-bg)"/>
    <text x="10" y="90" class="badge-text" fill="var(--accent-blue)">多语言高精库</text>
  </g>

  <path d="M 436 351 L 448 351" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- T6: LRCLIB -->
  <g transform="translate(450, 300)">
    <rect width="104" height="102" rx="6" fill="var(--panel-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="6" y="18" class="card-title">T6: LRCLIB</text>
    <text x="6" y="36" class="card-desc">• 全球最大开放歌词</text>
    <text x="6" y="52" class="card-desc">• 同步歌词免认证</text>
    <text x="6" y="68" class="card-desc">• 小众冷门大兜底</text>
    <rect x="6" y="78" width="92" height="16" rx="3" fill="var(--accent-orange-bg)"/>
    <text x="10" y="90" class="badge-text" fill="var(--accent-orange)">全球开放曲库</text>
  </g>

  <!-- Flow 2 -> 3 Branches -->
  <path d="M 572 191 L 588 191" stroke="var(--accent-green)" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="562" y="178" class="badge-text" fill="var(--accent-green)">命中逐字</text>

  <path d="M 572 351 L 584 351 L 584 270 L 590 270" fill="none" stroke="var(--accent-purple)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="548" y="340" class="branch-lbl">有行无字</text>

  <!-- ==================== Section 3: v1.6.1 Acoustic Engine & QC (x=592, w=256) ==================== -->
  <rect x="592" y="72" width="256" height="384" rx="8" fill="var(--panel-bg)" stroke="var(--accent-purple)" stroke-width="1.5"/>
  <text x="604" y="96" class="sect-title" fill="var(--accent-purple)">⚡ 1.6.1 声学打轴 · 闸门 · 质检中枢</text>

  <!-- 3.1 Dual-Engine Windowed CTC -->
  <g transform="translate(602, 112)">
    <rect width="236" height="104" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="8" y="18" class="card-title">🎤 双专用 CTC 逐行切窗打轴</text>
    <text x="8" y="34" class="card-desc">• 粤语：wav2vec2-cantonese</text>
    <text x="8" y="50" class="card-desc">• 国语：wav2vec2-chinese</text>
    <text x="8" y="66" class="card-desc">• 逐行窗对齐：彻底消灭全局漂移与吞停顿</text>
    <rect x="8" y="76" width="220" height="18" rx="3" fill="var(--accent-purple-bg)"/>
    <text x="14" y="89" class="badge-text" fill="var(--accent-purple)">绝不改词 · 英文大小写回退 · 标点间隙吸附</text>
  </g>

  <!-- Flow 3.1 -> 3.2 -->
  <path d="M 720 216 L 720 228" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3.2 Gate -->
  <g transform="translate(602, 230)">
    <rect width="236" height="96" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="8" y="18" class="card-title">🛡️ 逐行合理性闸 (Gate) · 自动回退</text>
    <text x="8" y="34" class="card-desc">• 双阈值 1200ms / 硬限 1600ms</text>
    <text x="8" y="50" class="card-desc">• 长音放行(&lt;250ms) / 吞停顿拦截</text>
    <text x="8" y="66" class="card-desc">• 异常行还原旧值，记 gate_reverts</text>
    <rect x="8" y="72" width="220" height="16" rx="3" fill="var(--accent-green-bg)"/>
    <text x="14" y="84" class="badge-text" fill="var(--accent-green)">粤语熔断转普通话 · zh 出货横向验货门禁</text>
  </g>

  <!-- Flow 3.2 -> 3.3 -->
  <path d="M 720 326 L 720 338" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3.3 Line Axis & QC -->
  <g transform="translate(602, 340)">
    <rect width="236" height="106" rx="6" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
    <text x="8" y="18" class="card-title">📐 起唱轴校准与闭环质检 (Line Axis &amp; QC)</text>
    <text x="8" y="34" class="card-desc">• 行标签下沉：开口前 60ms，绝不抢跑</text>
    <text x="8" y="50" class="card-desc">• 防重叠：后推≤99ms，间距≥50ms</text>
    <text x="8" y="66" class="card-desc">• QC 闭环：L1 修复 / L2 分诊 / L3 复检</text>
    <rect x="8" y="78" width="220" height="18" rx="3" fill="var(--accent-blue-bg)"/>
    <text x="14" y="91" class="badge-text" fill="var(--accent-blue)">双语译文成对跟随 · 彻底告别播放器抽搐跳屏</text>
  </g>

  <!-- Flow 3 -> 4 Delivery -->
  <path d="M 848 264 L 866 264" stroke="var(--accent-green)" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- ==================== Section 4: Delivery (x=868, w=64) ==================== -->
  <rect x="868" y="72" width="64" height="384" rx="8" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1.5"/>
  <text x="874" y="96" class="sect-title">💎 交付</text>

  <g transform="translate(872, 112)">
    <rect width="56" height="334" rx="6" fill="var(--card-bg)" stroke="var(--accent-green)" stroke-width="1.5"/>
    <text x="6" y="24" class="card-title" fill="var(--accent-green)">三位一体</text>
    <text x="6" y="44" class="card-desc">同目录</text>

    <line x1="6" y1="56" x2="50" y2="56" stroke="var(--card-border)" stroke-width="1"/>

    <text x="6" y="80" class="card-title">.spl</text>
    <text x="6" y="96" class="card-desc">椒盐逐字</text>

    <line x1="6" y1="112" x2="50" y2="112" stroke="var(--card-border)" stroke-width="1"/>

    <text x="6" y="136" class="card-title">.lrc</text>
    <text x="6" y="152" class="card-desc">ELRC标准</text>

    <line x1="6" y1="168" x2="50" y2="168" stroke="var(--card-border)" stroke-width="1"/>

    <text x="6" y="192" class="card-title">内嵌</text>
    <text x="6" y="208" class="card-desc">USLT/©lyr</text>

    <line x1="6" y1="224" x2="50" y2="224" stroke="var(--card-border)" stroke-width="1"/>

    <rect x="4" y="240" width="48" height="82" rx="4" fill="var(--accent-green-bg)"/>
    <text x="6" y="260" class="badge-text" fill="var(--accent-green)">100%</text>
    <text x="6" y="278" class="badge-text" fill="var(--accent-green)">SHA-256</text>
    <text x="6" y="296" class="badge-text" fill="var(--accent-green)">逐字节</text>
    <text x="6" y="312" class="badge-text" fill="var(--accent-green)">严格一致</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <style>
      :root {
        --bg: #ffffff;
        --panel-bg: #f8fafc;
        --panel-border: #e2e8f0;
        --card-bg: #ffffff;
        --card-border: #cbd5e1;
        --text-title: #0f172a;
        --text-body: #334155;
        --text-sub: #64748b;
        --accent-blue: #0284c7;
        --accent-blue-bg: #e0f2fe;
        --accent-purple: #7c3aed;
        --accent-purple-bg: #ede9fe;
        --accent-green: #16a34a;
        --accent-green-bg: #dcfce7;
        --accent-amber: #d97706;
        --accent-amber-bg: #fef3c7;
        --accent-rose: #e11d48;
        --accent-rose-bg: #ffe4e6;
        --line: #94a3b8;
        --arrow: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --panel-bg: #111827;
          --panel-border: #1f2937;
          --card-bg: #1e293b;
          --card-border: #334155;
          --text-title: #f8fafc;
          --text-body: #e2e8f0;
          --text-sub: #94a3b8;
          --accent-blue: #38bdf8;
          --accent-blue-bg: #082f49;
          --accent-purple: #a78bfa;
          --accent-purple-bg: #2e1065;
          --accent-green: #4ade80;
          --accent-green-bg: #052e16;
          --accent-amber: #fbbf24;
          --accent-amber-bg: #451a03;
          --accent-rose: #fb7185;
          --accent-rose-bg: #4c0519;
          --line: #475569;
          --arrow: #94a3b8;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: var(--text-title); letter-spacing: -0.2px; }
      .subtitle { font-size: 11.5px; fill: var(--text-sub); }
      .sect-title { font-size: 12px; font-weight: 700; fill: var(--text-title); }
      .card-title { font-size: 11px; font-weight: 600; fill: var(--text-title); }
      .card-body { font-size: 10px; fill: var(--text-body); }
      .card-sub { font-size: 9.5px; fill: var(--text-sub); }
      .badge-txt { font-size: 9px; font-weight: 700; }
    </style>

    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="var(--arrow)"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="var(--accent-blue)"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="var(--accent-green)"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="var(--accent-purple)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="14" fill="var(--bg)"/>

  <!-- Header -->
  <text x="24" y="32" class="title">🎵 music-tag-lyrics v1.8.4 全景架构与 Canonical 标准化流水线</text>
  <text x="24" y="49" class="subtitle">直连全球曲库与 ISRC 网络 · 粤语/国语双声学 CTC 打轴 · Canonical 双向毫秒对齐与前奏流光调度 · 绝不破坏原音频本体</text>

  <!-- ==================== 1. 音频输入与标签规范 (x=20, w=130) ==================== -->
  <rect x="20" y="66" width="130" height="398" rx="10" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1"/>
  <text x="32" y="88" class="sect-title">🎧 音频读取与清洗</text>

  <!-- Card 1.1: Audio input -->
  <rect x="28" y="102" width="114" height="106" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <rect x="36" y="112" width="46" height="16" rx="4" fill="var(--accent-blue-bg)"/>
  <text x="40" y="124" class="badge-txt" fill="var(--accent-blue)">原始母盘</text>
  <text x="36" y="144" class="card-title">FLAC / MP3</text>
  <text x="36" y="159" class="card-title">M4A / WAV</text>
  <text x="36" y="177" class="card-sub">只读探测元数据</text>
  <text x="36" y="193" class="card-sub" fill="var(--accent-green)">✔ 绝不直接改动</text>

  <!-- Card 1.2: Tag cleaning -->
  <rect x="28" y="222" width="114" height="152" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="36" y="242" class="card-title">🏷️ 规范化洗标</text>
  <text x="36" y="260" class="card-body">• 合唱歌手用 / 分隔</text>
  <text x="36" y="277" class="card-body">• 4 位年份规范化</text>
  <text x="36" y="294" class="card-body">• 自动提取词曲作者</text>
  <text x="36" y="311" class="card-body">• 标题-歌手防空兜底</text>
  <text x="36" y="328" class="card-body">• 单帧 USLT 避免冲突</text>
  <text x="36" y="347" class="card-sub" fill="var(--accent-amber)">已有信息绝对保护</text>
  <text x="36" y="362" class="card-sub" fill="var(--accent-green)">✔ 零覆盖手填元数据</text>

  <!-- Connect 1 -> 2 -->
  <path d="M 142 155 L 166 155" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <path d="M 142 298 L 166 298" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ==================== 2. 全球多源梯级检索 (x=166, w=268) ==================== -->
  <rect x="166" y="66" width="268" height="398" rx="10" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1"/>
  <text x="178" y="88" class="sect-title">🌐 全球多源梯级搜词 (单调防降级)</text>

  <!-- Tier 1: Apple TTML + lrc.red -->
  <rect x="176" y="102" width="248" height="72" rx="8" fill="var(--card-bg)" stroke="var(--accent-purple)" stroke-width="1.5"/>
  <rect x="184" y="110" width="78" height="15" rx="3" fill="var(--accent-purple-bg)"/>
  <text x="188" y="121" class="badge-txt" fill="var(--accent-purple)">T1 官方母带逐字</text>
  <text x="270" y="122" class="badge-txt" fill="var(--accent-green)">双引擎直连</text>
  <text x="184" y="141" class="card-title">Apple Music TTML + lrc.red</text>
  <text x="184" y="157" class="card-sub">毫秒级字块 · 全球 ISRC 直通 · 独立 iTunes 命名空间</text>

  <!-- Tier 2: NetEase YRC -->
  <rect x="176" y="180" width="120" height="66" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <rect x="182" y="188" width="56" height="14" rx="3" fill="var(--accent-blue-bg)"/>
  <text x="186" y="198" class="badge-txt" fill="var(--accent-blue)">T2 网易云</text>
  <text x="182" y="217" class="card-title">YRC 原生逐字</text>
  <text x="182" y="232" class="card-sub">同轴 ytlrc 精修双语</text>

  <!-- Tier 3: QQ Music QRC -->
  <rect x="304" y="180" width="120" height="66" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <rect x="310" y="188" width="58" height="14" rx="3" fill="var(--accent-green-bg)"/>
  <text x="314" y="198" class="badge-txt" fill="var(--accent-green)">T3 QQ 音乐</text>
  <text x="310" y="217" class="card-title">QRC 3DES 逐字</text>
  <text x="310" y="232" class="card-sub">高精度字(起,长)切片</text>

  <!-- Tier 4: Kugou -->
  <rect x="176" y="252" width="120" height="54" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="184" y="271" class="card-title">T4 酷狗 KRC 逐字</text>
  <text x="184" y="287" class="card-sub">XOR 解密 · Live 互斥门禁</text>

  <!-- Tier 5: Fallbacks -->
  <rect x="304" y="252" width="120" height="54" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="312" y="271" class="card-title">T5~T7 开放网络</text>
  <text x="312" y="287" class="card-sub">AMLL / LRCSHARE / LIB</text>

  <!-- Route Decision Box -->
  <rect x="176" y="314" width="248" height="66" rx="8" fill="var(--panel-bg)" stroke="var(--card-border)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="186" y="333" class="card-title">🔀 命中结果智能分流</text>
  <text x="186" y="350" class="card-body">已有优质逐字歌词 ──► 直接进入标准化审计</text>
  <text x="186" y="367" class="card-body" fill="var(--accent-amber)">仅有纯文本 / 绝版老歌 ──► 切入本地声学打轴</text>

  <!-- Connect 2 -> 4 (Directly to Canonical) -->
  <path d="M 424 138 C 500 138, 580 140, 658 140" stroke="var(--accent-purple)" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="470" y="132" class="badge-txt" fill="var(--accent-purple)">逐字直通 Canonical</text>

  <!-- Connect 2 -> 3 (Fallback to Acoustic) -->
  <path d="M 424 355 L 448 355" stroke="var(--accent-amber)" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ==================== 3. 本地 AI 声学打轴 (x=448, w=196) ==================== -->
  <rect x="448" y="66" width="196" height="398" rx="10" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1"/>
  <text x="458" y="88" class="sect-title">🎙️ 本地 AI 声学打轴</text>

  <!-- Demucs v4 -->
  <rect x="456" y="162" width="180" height="64" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="466" y="182" class="card-title">Demucs v4 音轨分离</text>
  <text x="466" y="198" class="card-sub">高质量提取纯净人声音轨</text>
  <text x="466" y="213" class="card-sub" fill="var(--accent-blue)">消灭伴奏干扰 · 消除底噪</text>

  <!-- Dual CTC Models -->
  <rect x="456" y="234" width="180" height="106" rx="8" fill="var(--card-bg)" stroke="var(--accent-blue)" stroke-width="1.5"/>
  <rect x="464" y="242" width="86" height="15" rx="3" fill="var(--accent-blue-bg)"/>
  <text x="468" y="253" class="badge-txt" fill="var(--accent-blue)">双专用 CTC 引擎</text>
  <text x="466" y="274" class="card-title">普通话 + 粤语 逐行窗</text>
  <text x="466" y="291" class="card-sub">• 703 类无调粤拼字典消歧</text>
  <text x="466" y="306" class="card-sub">• 逐行切窗对齐彻底防漂移</text>
  <text x="466" y="322" class="card-sub" fill="var(--accent-green)">✔ 基于原词打轴，绝不听写盲猜</text>

  <!-- Axis & QC -->
  <rect x="456" y="348" width="180" height="74" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="466" y="367" class="card-title">起唱微调与双层质检</text>
  <text x="466" y="384" class="card-sub">• 行轴自动下沉 60ms 刚好亮起</text>
  <text x="466" y="400" class="card-sub">• 软硬字宽闸门消除异常长音</text>

  <!-- Connect 3 -> 4 (Acoustic to Canonical) -->
  <path d="M 636 295 C 646 295, 650 250, 658 250" stroke="var(--line)" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ==================== 4. Canonical 标准化中枢 (x=658, w=172) ==================== -->
  <rect x="658" y="66" width="172" height="398" rx="10" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1"/>
  <rect x="666" y="76" width="62" height="15" rx="3" fill="var(--accent-rose-bg)"/>
  <text x="670" y="87" class="badge-txt" fill="var(--accent-rose)">v1.8.4 核心</text>
  <text x="666" y="108" class="sect-title">⚡ Canonical 中枢</text>

  <!-- Box 4.1: Double Check -->
  <rect x="666" y="120" width="156" height="78" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="674" y="139" class="card-title">双向结构对齐审计</text>
  <text x="674" y="156" class="card-sub">• ELRC ↔ TTML 毫秒对齐</text>
  <text x="674" y="171" class="card-sub">• 容差 ≤ 1ms / div ≤ 2ms</text>
  <text x="674" y="186" class="card-sub" fill="var(--accent-green)">同源丢字强校验</text>

  <!-- Box 4.2: Credit clean -->
  <rect x="666" y="206" width="156" height="96" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="674" y="225" class="card-title">全曲制作署名剥离</text>
  <text x="674" y="242" class="card-sub">• 前中后制作名单扫描</text>
  <text x="674" y="257" class="card-sub">• 自动剥离回填词曲元数据</text>
  <text x="674" y="272" class="card-sub">• 唱词/念白/原唱绝对保留</text>
  <text x="674" y="287" class="card-sub" fill="var(--accent-amber)">存疑行复核，绝不误删</text>

  <!-- Box 4.3: Prelude Scheduler -->
  <rect x="666" y="310" width="156" height="88" rx="8" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1"/>
  <text x="674" y="329" class="card-title">前奏倒计时流光排版</text>
  <text x="674" y="346" class="card-sub">• 精准锁定首唱时间 T</text>
  <text x="674" y="361" class="card-sub">• T &gt; 20s: 模式 A 固定窗口</text>
  <text x="674" y="376" class="card-sub">• T ≤ 20s: 模式 B 比例收缩</text>
  <text x="674" y="391" class="card-sub" fill="var(--accent-green)">演唱字块绝对零改动</text>

  <!-- Connect 4 -> 5 -->
  <path d="M 822 155 L 844 155" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 822 254 L 844 254" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 822 355 L 844 355" stroke="var(--line)" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ==================== 5. 规范化三位一体交付 (x=844, w=96) ==================== -->
  <rect x="844" y="66" width="96" height="398" rx="10" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1"/>
  <text x="852" y="88" class="sect-title">📦 规范交付</text>

  <!-- Delivery 1: ELRC -->
  <rect x="850" y="106" width="84" height="66" rx="7" fill="var(--card-bg)" stroke="var(--accent-green)" stroke-width="1.2"/>
  <text x="858" y="125" class="card-title" fill="var(--accent-green)">.lrc 逐字</text>
  <text x="858" y="141" class="card-sub">Enhanced</text>
  <text x="858" y="156" class="card-sub">3位毫秒流光</text>

  <!-- Delivery 2: SPL -->
  <rect x="850" y="180" width="84" height="66" rx="7" fill="var(--card-bg)" stroke="var(--accent-purple)" stroke-width="1.2"/>
  <text x="858" y="199" class="card-title" fill="var(--accent-purple)">.spl 歌词</text>
  <text x="858" y="215" class="card-sub">椒盐音乐原生</text>
  <text x="858" y="230" class="card-sub">精修双语译文</text>

  <!-- Delivery 3: TTML -->
  <rect x="850" y="254" width="84" height="66" rx="7" fill="var(--card-bg)" stroke="var(--accent-blue)" stroke-width="1.2"/>
  <text x="858" y="273" class="card-title" fill="var(--accent-blue)">.ttml 规范</text>
  <text x="858" y="289" class="card-sub">单行 Apple XML</text>
  <text x="858" y="304" class="card-sub">独立 head 译文</text>

  <!-- Delivery 4: Container -->
  <rect x="850" y="328" width="84" height="74" rx="7" fill="var(--card-bg)" stroke="var(--accent-amber)" stroke-width="1.2"/>
  <text x="858" y="347" class="card-title" fill="var(--accent-amber)">音频标签</text>
  <text x="858" y="363" class="card-sub">安全副本回写</text>
  <text x="858" y="378" class="card-sub">回读双重比对</text>
  <text x="858" y="393" class="card-sub" fill="var(--accent-green)">零损伤源音频</text>

</svg>
